<!DOCTYPE html>
<html>
    <head>
        <title>Tilkommen inntekt</title>
        <style>
            html {
                font-family: 'Brush Script MT', cursive;
            }
            html, body, #karusell {
                height: 99%;
            }
            .periode {
                height: 100%;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                font-size: 5em;
                background-image: url("harts.png");
                background-size: cover;
                padding-left: 2em;
                padding-right: 2em;
            }
            div.periode > .tekstgreie {
            }
            div.periode > .tid {
                padding-right: 0.2em;
                color: #FFFFAA;
            }
            .tall {
                font-size: 1.5em;
                color: #FFE3AA;
            }
            .pretall {
                color: #FFE3AA;
            }
            .posttall {
                color: #FFE3AA;
            }

            .astrx {
                position: absolute;
                font-size: 0.6em;
                cursor: help;
            }
            .arbeidsdager {
                font-size: 0.2em;
                margin-left: auto;
                transition-property: color;
                transition-timing-function: ease-in-out;
                transition-duration: 1s;
            }
            .show {
                color: #FFE3AAFF;
            }
            .hide {
                color: #12073A00;
            }
            .delay_one {
                transition-delay: .5s;
            }
            .delay_two {
                transition-delay: 2s;
            }
            .delay_three {
                transition-delay: 4s;
            }
            .delay_four {
                transition-delay: 6s;
            }
            
        </style>
    </head>
    <body>
        <section id="karusell" class="periode show">
            Tilkommen inntekt er ferdig!
        </section>
    </body>
</html>
